<!--
  Aegora · Lucía — lanzador con chat y voz, para pegar en la web del cliente.

  Es el diseño del lanzador que ya usábamos, con el chat reconectado al webchat
  de verdad (`WEBCHAT · Adapter` -> Entry -> Core v2). Cambios respecto a la
  versión anterior del snippet, y por qué:

  1. Endpoint y contrato: POST {message, session_key} -> {reply, client_session_id}.
     Antes iba a `/webhook/webchat-router` con `{message, sessionId, client_id}`
     y leía `data.response`, que es de otro montaje.

  2. El hilo se guarda en localStorage. Antes se generaba un `sess_` nuevo en
     cada carga de página, así que recargar perdía la conversación entera y el
     aviso de privacidad volvía a salir.

  3. `client_id` NO se manda desde el navegador. El tenant lo decide el nodo
     `Config` del adapter: si viniera del cliente, cualquiera podría dirigirse
     al n8n de otro negocio cambiando una línea en el inspector.

  4. El texto del bot se ESCAPA antes de renderizarse y solo se permiten
     negrita, cursiva, código, listas y enlaces http(s). La versión anterior
     metía la respuesta en innerHTML tal cual: bastaba con que el modelo
     repitiera algo que le hubiera escrito un visitante para ejecutar HTML en
     la página del cliente.

  5. Listas de verdad. Lucía da los huecos libres como lista con `-`, que es el
     mensaje más frecuente que manda; sin renderizarlas salían los guiones
     crudos.

  6. Aviso de privacidad (RGPD art. 13) al abrir el panel. En webchat existe ese
     momento y en WhatsApp no, que es por lo que allí viaja como botón.

  Pegar tal cual en el <body> de la web (o en el bloque de código del CMS).
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

  #custom-voice-trigger-root {
    all: initial; font-family: 'Nunito', sans-serif;
    position: fixed !important; bottom: 20px; right: 20px; z-index: 2147483647;
    display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 12px;
  }

  #main-trigger-btn {
    display: flex; align-items: center; gap: 12px; cursor: pointer; background: #ffffff;
    padding: 10px 20px 10px 10px; border-radius: 50px; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    border: 1px solid #f0f0f0; transition: transform 0.2s ease;
  }
  #main-trigger-btn:hover { transform: scale(1.02); }
  .chat-open #main-trigger-btn { display: none !important; }

  .avatar-wrapper {
    position: relative; width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #33C3C7, #15364a);
    padding: 3px; display: flex; justify-content: center; align-items: center;
  }
  .voice-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #fff; display: block; }
  .voice-text-col { display: flex; flex-direction: column; line-height: 1.2; }
  .voice-name { font-weight: 700; color: #2c3e50; font-size: 16px; }
  .voice-status { font-size: 13px; color: #33C3C7; font-weight: 600; }

  #options-menu {
    display: flex; flex-direction: column; gap: 8px; opacity: 0; pointer-events: none;
    transform: translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .menu-open #options-menu { opacity: 1; pointer-events: all; transform: translateY(0); }

  .option-btn {
    display: flex; align-items: center; gap: 10px; background: white; padding: 12px 20px;
    border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer;
    font-weight: 600; color: #444; transition: background 0.2s; min-width: 170px; font-size: 14px;
  }
  .option-btn:hover { background: #f9f9f9; color: #33C3C7; }
  .icon-svg { width: 20px; height: 20px; fill: currentColor; }

  #lucia-chat-window {
    width: 350px; max-width: calc(100vw - 40px);
    height: 500px; max-height: calc(100vh - 120px);
    background: white; border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column;
    overflow: hidden; opacity: 0; pointer-events: none; transform: translateY(20px);
    transition: all 0.3s ease; position: absolute; bottom: 20px; right: 0;
  }
  .chat-open #lucia-chat-window { opacity: 1; pointer-events: all; transform: translateY(0); }

  .chat-header { background: linear-gradient(135deg, #33C3C7, #15364a); padding: 15px; display: flex; align-items: center; gap: 10px; color: white; }
  .chat-header h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .chat-header p { margin: 0; font-size: 12px; opacity: 0.9; }
  .close-chat { margin-left: auto; cursor: pointer; font-size: 18px; opacity: 0.8; }

  #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }

  .msg { max-width: 80%; padding: 14px 18px; border-radius: 14px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #33C3C7; color: white; border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: white; color: #333; border: 1px solid #eee; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .msg.loading { align-self: flex-start; background: transparent; color: #999; font-style: italic; border: none; box-shadow: none; padding-left: 0; }

  /* Lucía lista los huecos libres con viñetas: sin esto salen pegadas al borde. */
  .msg.bot ul { margin: 6px 0; padding-left: 20px; }
  .msg.bot li { margin: 2px 0; }
  .msg.bot code { background: #f0f2f4; border-radius: 4px; padding: 0 3px; font-size: .92em; }
  .msg.bot a { color: #15364a; }

  /* Aviso de privacidad: presente pero discreto, no un muro. */
  .msg.privacy { align-self: stretch; max-width: 100%; background: #eef7f7; border: 1px solid #d6ecec;
    color: #4a6b6b; font-size: 13px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; }
  .msg.privacy a { color: #15364a; font-weight: 600; }

  .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
  #chat-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; font-family: inherit; font-size: 14px; }
  #chat-send { background: #15364a; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  #chat-send:hover { background: #33C3C7; }
  #chat-send:disabled { opacity: .5; cursor: default; background: #15364a; }

  .is-active-call .avatar-wrapper { background: linear-gradient(135deg, #e74c3c, #f39c12); animation: pulse-border 1.5s infinite; }
  @keyframes pulse-border {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
  }
</style>

<script type="module">
  import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk@latest';

  // ---------------------------------------------------------------- configuración
  // CONFIRMAR antes de publicar. Es el WEBHOOK_HOST del tenant, no el de n8n:
  //   grep WEBHOOK_HOST /opt/aegora/tenants/demo/config/tenant.env
  // Ese host solo expone /webhook/*; el editor de n8n no se publica ahí.
  const N8N_CHAT_URL  = "https://REVISAR-WEBHOOK-HOST/webhook/webchat";
  const N8N_VOICE_URL = "https://n8n.aegora.aegora.es/webhook/get-retell-token";
  const AGENT_IMAGE   = "https://storage.googleapis.com/msgsndr/7lZ4uAUVIZQ5FUFGuqbq/media/697b5ff5d5b65ee31fa397fc.png";
  const AGENT_NAME    = "Lucía";
  const GREETING      = `¡Hola! Soy ${AGENT_NAME}. ¿En qué puedo ayudarte hoy?`;

  // RGPD art. 13. Se enseña al abrir el panel, antes de que escriba nada.
  const PRIVACY_URL   = "https://aegora.es/politica-privacidad";
  const PRIVACY_TEXT  = "Guardamos tus datos solo para gestionar tu cita.";
  const PRIVACY_LABEL = "Política de Privacidad";

  // Solo para la voz (Retell). El chat NO manda tenant: lo decide el adapter.
  const CLIENT_ID = "asesoria_fiscal";

  const SKEY = 'aegora_webchat_sid';
  let sessionKey = null;
  try { sessionKey = localStorage.getItem(SKEY); } catch (e) {}

  // ------------------------------------------------------------------- markdown
  // Escapar SIEMPRE primero y transformar después: así el texto del modelo no
  // puede introducir etiquetas, solo las que generamos nosotros. Los href salen
  // de un patrón que solo acepta http(s), de modo que no cabe un `javascript:`.
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  function render(text) {
    const t = esc(text)
      .replace(/^#{1,6}\s*(.+)$/gm, '<strong>$1</strong>')
      .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])_(.+?)_(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
               '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
               '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

    let html = '', enLista = false;
    for (const ln of t.split('\n')) {
      const punto = ln.match(/^\s*[-*+]\s+(.*)$/) || ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (punto) {
        if (!enLista) { html += '<ul>'; enLista = true; }
        html += `<li>${punto[1]}</li>`;
      } else {
        if (enLista) { html += '</ul>'; enLista = false; }
        html += ln ? `${ln}<br>` : '<br>';
      }
    }
    if (enLista) html += '</ul>';
    return html.replace(/(<br>)+$/, '');
  }

  function addMessage(text, sender, container) {
    const div = document.createElement('div');
    div.classList.add('msg', sender);
    if (sender === 'bot') div.innerHTML = render(text);
    else div.innerText = text;          // lo que escribe el visitante, nunca como HTML
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  // --------------------------------------------------------------------- widget
  async function initWidget() {
    if (document.getElementById('custom-voice-trigger-root')) return;
    if (!document.body) { await new Promise(r => window.addEventListener('load', r)); }

    const root = document.createElement('div');
    root.id = 'custom-voice-trigger-root';
    root.innerHTML = `
      <div id="lucia-chat-window">
        <div class="chat-header">
            <img src="${AGENT_IMAGE}" alt="" style="width:30px;height:30px;border-radius:50%;border:2px solid white;">
            <div>
                <h3>${AGENT_NAME}</h3>
                <p>Asistente Virtual</p>
            </div>
            <span class="close-chat" role="button" aria-label="Cerrar">✕</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="chat-send" aria-label="Enviar">➤</button>
        </div>
      </div>

      <div id="options-menu">
        <div class="option-btn" id="btn-opt-chat">
           <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
           Chatear ahora
        </div>
        <div class="option-btn" id="btn-opt-call">
           <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.23 0 2.44.2 3.57.57.35.13.75.05 1.02-.24l2.2-2.2z"/></svg>
           Hablar ahora
        </div>
      </div>

      <div id="main-trigger-btn">
        <div class="avatar-wrapper"><img src="${AGENT_IMAGE}" alt="" class="voice-avatar"></div>
        <div class="voice-text-col">
          <span class="voice-name">¿Tienes dudas?</span>
          <span class="voice-status" id="voice-status-text">Escríbe o llámanos</span>
        </div>
      </div>`;
    document.body.appendChild(root);
    setupListeners(root);
  }

  function setupListeners(root) {
    const mainBtn = document.getElementById('main-trigger-btn');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const messages = document.getElementById('chat-messages');
    const statusText = document.getElementById('voice-status-text');

    const retellWebClient = new RetellWebClient();
    let isMenuOpen = false, isChatOpen = false, isCalling = false;
    let enVuelo = false, saludado = false;

    function abrirChat() {
      root.classList.remove('menu-open'); isMenuOpen = false;
      root.classList.add('chat-open'); isChatOpen = true;
      statusText.innerText = "Chateando...";
      if (!saludado) {
        saludado = true;
        if (PRIVACY_URL) {
          const aviso = document.createElement('div');
          aviso.classList.add('msg', 'privacy');
          aviso.innerHTML = render(`${PRIVACY_TEXT} [${PRIVACY_LABEL}](${PRIVACY_URL})`);
          messages.appendChild(aviso);
        }
        addMessage(GREETING, 'bot', messages);
      }
      setTimeout(() => chatInput.focus(), 300);
    }

    function cerrarChat() {
      root.classList.remove('chat-open'); isChatOpen = false;
      statusText.innerText = "Escríbe o llámanos";
    }

    mainBtn.addEventListener('click', () => {
      if (isChatOpen) { cerrarChat(); return; }
      if (isCalling) { retellWebClient.stopCall(); return; }
      isMenuOpen = !isMenuOpen;
      root.classList.toggle('menu-open', isMenuOpen);
      statusText.innerText = isMenuOpen ? "Selecciona opción" : "Escríbe o llámanos";
    });

    document.getElementById('btn-opt-chat').addEventListener('click', abrirChat);
    document.querySelector('.close-chat').addEventListener('click', cerrarChat);
    document.getElementById('btn-opt-call').addEventListener('click', () => {
      root.classList.remove('menu-open'); isMenuOpen = false;
      startVoiceCall(statusText, retellWebClient);
    });

    async function sendMessage() {
      const text = chatInput.value.trim();
      // Una petición en vuelo: sin esto, pulsar Enter dos veces manda dos turnos
      // y el agente contesta a los dos en desorden.
      if (!text || enVuelo) return;

      addMessage(text, 'user', messages);
      chatInput.value = '';
      enVuelo = true; chatSend.disabled = true;
      const cargando = addMessage(`${AGENT_NAME} está escribiendo...`, 'loading', messages);

      try {
        const res = await fetch(N8N_CHAT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_key: sessionKey })
        });
        const data = await res.json();
        cargando.remove();
        // El adapter acuña el id de hilo en el primer mensaje y lo devuelve para
        // que lo guardemos: así la conversación sobrevive a recargar la página.
        if (data && data.client_session_id) {
          sessionKey = data.client_session_id;
          try { localStorage.setItem(SKEY, sessionKey); } catch (e) {}
        }
        addMessage((data && data.reply) || 'Ahora mismo no puedo responder. Inténtalo en un momento.',
                   'bot', messages);
      } catch (e) {
        cargando.remove();
        addMessage('No he podido conectar. ¿Lo intentamos de nuevo?', 'bot', messages);
      } finally {
        enVuelo = false; chatSend.disabled = false;
        chatInput.focus();
      }
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    retellWebClient.on("call_started", () => {
      isCalling = true;
      statusText.innerText = "Escuchando...";
      mainBtn.classList.add('is-active-call');
    });
    retellWebClient.on("call_ended", () => {
      isCalling = false;
      statusText.innerText = "Escríbe o llámanos";
      mainBtn.classList.remove('is-active-call');
    });
  }

  async function startVoiceCall(statusText, client) {
    statusText.innerText = "Conectando...";
    statusText.style.color = "#f39c12";
    try {
      const res = await fetch(N8N_VOICE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: CLIENT_ID })
      });
      const data = await res.json();
      const accessToken = data.access_token || (data[0] && data[0].access_token) || data.token;
      if (!accessToken) throw new Error("No token");
      await client.startCall({ accessToken, sampleRate: 24000, captureDeviceId: "default", emitAudio: true });
    } catch (error) {
      statusText.innerText = "Error conexión";
      statusText.style.color = "red";
      setTimeout(() => { statusText.innerText = "Escríbe o llámanos"; statusText.style.color = "#33C3C7"; }, 3000);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWidget);
  else initWidget();
</script>
